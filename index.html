<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating Drama Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Crimson+Text:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    @keyframes curtainLeft {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0); }
    }
    
    @keyframes curtainRight {
      0% { transform: translateX(100%); }
      100% { transform: translateX(0); }
    }
    
    @keyframes spotlight {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    
    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    
    .curtain-left {
      animation: curtainLeft 1s ease-out forwards;
    }
    
    .curtain-right {
      animation: curtainRight 1s ease-out forwards;
    }
    
    .spotlight {
      animation: spotlight 3s ease-in-out infinite;
    }
    
    .float-star {
      animation: floatStar 2s ease-in-out infinite;
    }
    
    .shimmer-text {
      background: linear-gradient(90deg, #FFD700 0%, #FFF8DC 25%, #FFD700 50%, #FFF8DC 75%, #FFD700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    
    .drama-card {
      background: linear-gradient(145deg, rgba(26, 35, 75, 0.95) 0%, rgba(45, 25, 55, 0.95) 100%);
      border: 3px solid;
      border-image: linear-gradient(135deg, #FFD700, #DC143C, #FF69B4, #FFD700) 1;
    }
    
    .star-rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 0.25rem;
    }
    
    .star-rating input {
      display: none;
    }
    
    .star-rating label {
      cursor: pointer;
      font-size: 2rem;
      color: #4a5568;
      transition: all 0.2s ease;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
      color: #FFD700;
      text-shadow: 0 0 15px #FFD700, 0 0 25px #FF69B4;
      transform: scale(1.1);
    }
    
    .theater-input {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #FFD700;
      color: #FFF8DC;
      transition: all 0.3s ease;
    }
    
    .theater-input:focus {
      border-color: #FF69B4;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4), inset 0 0 10px rgba(255, 215, 0, 0.1);
      outline: none;
    }
    
    .theater-input::placeholder {
      color: #8b8b9e;
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #DC143C 0%, #8B0000 50%, #DC143C 100%);
      background-size: 200% 200%;
      border: 2px solid #FFD700;
      transition: all 0.3s ease;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    
    .submit-btn:hover:not(:disabled) {
      background-position: right center;
      box-shadow: 0 0 30px rgba(220, 20, 60, 0.6), 0 0 60px rgba(255, 215, 0, 0.3);
      transform: translateY(-2px);
    }
    
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .mask-icon {
      filter: drop-shadow(0 0 10px currentColor);
    }
    
    .toast {
      transform: translateY(100%);
      opacity: 0;
      transition: all 0.5s ease;
    }
    
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>

     <div class="mt-6 pt-4 border-t border-yellow-900/50"><label class="block text-gray-400 text-sm mb-2" style="font-family: 'Crimson Text', serif;"> 🔗 URL Apps Script (opsional): </label> <input type="url" id="apps-script-url" placeholder="https://script.google.com/macros/s/..." class="w-full px-3 py-2 rounded-lg theater-input text-sm">

  <script>
    // Default configuration
    const defaultConfig = {
      form_title: 'Rating Drama Sekolah',
      submit_text: 'Kirim Rating',
      background_color: '#0a0a1a',
      accent_color: '#FFD700',
      primary_action_color: '#DC143C',
      secondary_color: '#FF69B4',
      text_color: '#FFF8DC'
    };

    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          const formTitle = document.getElementById('form-title');
          const submitText = document.getElementById('submit-text');
          
          if (formTitle) {
            formTitle.textContent = config.form_title || defaultConfig.form_title;
          }
          if (submitText) {
            submitText.textContent = `🎭 ${config.submit_text || defaultConfig.submit_text} 🎭`;
          }
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                config.accent_color = value;
                window.elementSdk.setConfig({ accent_color: value });
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                window.elementSdk.setConfig({ primary_action_color: value });
              }
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (value) => {
                config.secondary_color = value;
                window.elementSdk.setConfig({ secondary_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['form_title', config.form_title || defaultConfig.form_title],
          ['submit_text', config.submit_text || defaultConfig.submit_text]
        ])
      });
    }

    // Form handling
    const form = document.getElementById('rating-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const loadingText = document.getElementById('loading-text');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    const toastIcon = document.getElementById('toast-icon');

    function showToast(message, isSuccess = true) {
      toastMessage.textContent = message;
      toastIcon.textContent = isSuccess ? '✅' : '❌';
      toast.style.background = isSuccess 
        ? 'linear-gradient(135deg, #065f46 0%, #047857 100%)' 
        : 'linear-gradient(135deg, #991b1b 0%, #b91c1c 100%)';
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitText.classList.toggle('hidden', isLoading);
      loadingText.classList.toggle('hidden', !isLoading);
    }

    function getFormData() {
      const judulDrama = document.getElementById('judul-drama').value;
      const nilaiAlur = document.querySelector('input[name="NilaiAlur"]:checked')?.value;
      const nilaiAkting = document.querySelector('input[name="NilaiAkting"]:checked')?.value;
      const nilaiPesan = document.querySelector('input[name="NilaiPesan"]:checked')?.value;
      const komentar = document.getElementById('komentar').value;

      return {
        JudulDrama: judulDrama,
        NilaiAlur: parseInt(nilaiAlur) || 0,
        NilaiAkting: parseInt(nilaiAkting) || 0,
        NilaiPesan: parseInt(nilaiPesan) || 0,
        Komentar: komentar
      };
    }

    function validateForm() {
      const data = getFormData();
      
      if (!data.JudulDrama.trim()) {
        showToast('Mohon isi judul drama!', false);
        return false;
      }
      if (!data.NilaiAlur) {
        showToast('Mohon beri nilai alur cerita!', false);
        return false;
      }
      if (!data.NilaiAkting) {
        showToast('Mohon beri nilai akting!', false);
        return false;
      }
      if (!data.NilaiPesan) {
        showToast('Mohon beri nilai pesan moral!', false);
        return false;
      }
      
      return true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!validateForm()) return;
      
      const appsScriptUrl = document.getElementById('apps-script-url').value;
      const formData = getFormData();
      
      if (!appsScriptUrl) {
        // Demo mode - just show success
        console.log('Demo mode - Data yang akan dikirim:', formData);
        showToast('Rating gagal tercatat!', false);
        form.reset();
        return;
      }
      
      setLoading(true);
      
      try {
        const response = await fetch(appsScriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });
        
        // Since we use no-cors, we can't read the response
        // Assume success if no error thrown
        showToast('🎉 Rating berhasil dikirim ke Google Sheets!', true);
        form.reset();
        
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal mengirim rating. Coba lagi!', false);
      } finally {
        setLoading(false);
      }
    });

    // Add hover sound effect simulation with visual feedback
    document.querySelectorAll('.star-rating label').forEach(star => {
      star.addEventListener('mouseenter', () => {
        star.style.transform = 'scale(1.2) rotate(5deg)';
      });
      star.addEventListener('mouseleave', () => {
        star.style.transform = '';
      });
    });
  </script>
